name: QA Automation CI/CD

on:
  # Se ejecuta al hacer push en estas ramas
  push:
    branches: [main, clase-07-cicd]
  # Se ejecuta al abrir/actualizar un Pull Request hacia main
  pull_request:
    branches: [main]
  # Permite ejecutar manualmente desde la pestana Actions de GitHub
  workflow_dispatch:

# Si se hace push varias veces seguidas al mismo branch/PR, cancela la ejecucion anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JOB 1: Tests con el runner de Playwright (.spec.ts) - corre EN PARALELO con cucumber
  playwright:
    name: Playwright Tests
    timeout-minutes: 60      # cancela el job si supera 60 minutos
    runs-on: ubuntu-latest   # maquina virtual Linux en la nube de GitHub
    # Los secrets del Environment solo son accesibles si el job declara el environment
    environment: development
    steps:
      # Descarga el codigo del repositorio en la maquina virtual
      - name: Checkout code
        uses: actions/checkout@v4
      # Instala Node.js LTS con cache de npm para instalaciones mas rapidas
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      # npm ci es mas estricto que npm install, usa package-lock.json exacto
      - name: Install dependencies
        run: npm ci
      # Instala solo Chromium + librerias del sistema para mantener el pipeline rapido y estable
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      # Ejecuta todos los .spec.ts (clase-01 a clase-05) solo en Chromium
      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL }}
          SAUCEDEMO_USERNAME: ${{ secrets.SAUCEDEMO_USERNAME }}
          SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}
      # Sube el reporte como artefacto descargable desde la pestana Actions
      # !cancelled() -> sube aunque los tests fallen (para ver que paso)
      # retention-days: 30 -> se elimina automaticamente despues de 30 dias
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      # Sube los resultados crudos de Allure para poder generar/inspeccionar el reporte
      - name: Upload Allure results (playwright)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-playwright
          path: allure-results/
          retention-days: 30
          if-no-files-found: ignore

  # JOB 2: Tests BDD con Cucumber (.feature) - corre EN PARALELO con playwright
  cucumber:
    name: Cucumber BDD Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Los secrets del Environment solo son accesibles si el job declara el environment
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      # Ejecuta los escenarios Gherkin con el runner de Cucumber
      - name: Run Cucumber tests
        run: npm run cucumber
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL }}
          SAUCEDEMO_USERNAME: ${{ secrets.SAUCEDEMO_USERNAME }}
          SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}
      # Sube el reporte HTML de Cucumber como artefacto descargable
      - name: Upload Cucumber report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cucumber-report
          path: cucumber-report.html
          retention-days: 30
          if-no-files-found: ignore

  # JOB 3: notificacion CONSOLIDADA (una sola, no una por job) al finalizar el pipeline
  # Si no se configuran los secrets de Slack/Teams, los pasos se omiten automaticamente.
  notify:
    name: Notificar resultado del pipeline
    needs: [playwright, cucumber]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Calcular resultado global
        id: result
        run: |
          if [ "${{ needs.playwright.result }}" = "success" ] && [ "${{ needs.cucumber.result }}" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

      # Notificacion a Slack - requiere el secret SLACK_WEBHOOK_URL (Settings > Secrets and variables > Actions)
      - name: Notificar Slack
        if: ${{ !cancelled() && env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "QA Automation CI/CD: ${{ steps.result.outputs.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*QA Automation CI/CD* ${{ steps.result.outputs.status == 'success' && ':white_check_mark: PASSED' || ':x: FAILED' }}\n*Playwright:* `${{ needs.playwright.result }}`  |  *Cucumber:* `${{ needs.cucumber.result }}`\n*Branch:* `${{ github.ref_name }}`  |  *Commit:* `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver resultado en Actions>"
                  }
                }
              ]
            }

      # Notificacion a Microsoft Teams - requiere el secret TEAMS_WEBHOOK_URL (conector Incoming Webhook del canal)
      # Se envia via curl a un webhook generico (MessageCard), sin depender de una Action de terceros.
      - name: Notificar Microsoft Teams
        if: ${{ !cancelled() && env.TEAMS_WEBHOOK_URL != '' }}
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          STATUS="${{ steps.result.outputs.status }}"
          if [ "$STATUS" = "success" ]; then
            COLOR="00B294"; TITLE="PASSED"
          else
            COLOR="C4314B"; TITLE="FAILED"
          fi
          curl -sS -H "Content-Type: application/json" -d '{
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "summary": "QA Automation CI/CD '"$TITLE"'",
            "themeColor": "'"$COLOR"'",
            "title": "QA Automation CI/CD - '"$TITLE"'",
            "sections": [{
              "facts": [
                { "name": "Playwright", "value": "${{ needs.playwright.result }}" },
                { "name": "Cucumber", "value": "${{ needs.cucumber.result }}" },
                { "name": "Branch", "value": "${{ github.ref_name }}" },
                { "name": "Commit", "value": "${{ github.sha }}" }
              ]
            }],
            "potentialAction": [{
              "@type": "OpenUri",
              "name": "Ver resultado en Actions",
              "targets": [{ "os": "default", "uri": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }]
            }]
          }' "$TEAMS_WEBHOOK_URL"

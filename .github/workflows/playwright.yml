name: Playwright Tests

on:
  # Se ejecuta al hacer push en estas ramas
  push:
    branches: [main, clase-07-cicd]
  # Se ejecuta al abrir un Pull Request hacia estas ramas
  pull_request:
    branches: [main, clase-07-cicd]
  # Permite ejecutar manualmente desde GitHub Actions
  # Solo aparece el boton "Run workflow" si este archivo esta en la rama main
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Que flujo ejecutar"
        type: choice
        required: true
        default: all
        options:
          - all
          - playwright
          - cucumber
      playwright_paths:
        description: "Playwright: archivo/carpeta(s). Acepta lista separada por coma"
        type: string
        default: tests/clase-05
      playwright_grep:
        description: "Playwright: filtro --grep opcional (ej: @smoke)"
        type: string
        default: ""
      cucumber_paths:
        description: "Cucumber: .feature o carpeta(s). Acepta lista separada por coma"
        type: string
        default: tests/features/**/*.feature
      cucumber_tag:
        description: "Cucumber: filtro --tags opcional (ej: @smoke)"
        type: string
        default: ""

# Si se hace push varias veces seguidas al mismo branch/PR, cancela la corrida anterior
# que siga en curso (evita gastar minutos de Actions en corridas ya obsoletas)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JOB 1: Tests con el runner de Playwright (.spec.ts) - corre EN PARALELO con cucumber
  playwright:
    name: Playwright Tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_suite == 'all' || inputs.test_suite == 'playwright' }}
    timeout-minutes: 60      # cancela el job si supera 60 minutos
    runs-on: ubuntu-latest   # maquina virtual Linux en la nube de GitHub
    # Los secrets del Environment solo son accesibles si el job declara el environment
    environment: development
    steps:
      # Descarga el codigo del repositorio en la maquina virtual
      - name: Checkout code
        uses: actions/checkout@v4
      # Instala Node.js en su version LTS mas reciente
      # cache: npm -> reutiliza node_modules entre corridas usando package-lock.json como llave
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      # npm ci es mas estricto que npm install, usa package-lock.json exacto
      - name: Install dependencies
        run: npm ci
      # Instala Chromium + librerias del sistema necesarias en Linux
      # --with-deps: el OS Linux no trae esas librerias por defecto
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      # En push/PR corre tests/clase-05; en dispatch manual permite ruta(s) y grep opcional
      - name: Run Playwright tests
        run: |
          PW_PATHS="${{ inputs.playwright_paths }}"
          PW_GREP="${{ inputs.playwright_grep }}"

          [ -z "$PW_PATHS" ] && PW_PATHS="tests/clase-05"
          PW_PATHS=$(echo "$PW_PATHS" | tr ',' ' ')

          if [ -n "$PW_GREP" ]; then
            npx playwright test $PW_PATHS --grep "$PW_GREP"
          else
            npx playwright test $PW_PATHS
          fi
        env:
          BASE_URL: ${{ vars.BASE_URL || secrets.BASE_URL }}
          SAUCEDEMO_USERNAME: ${{ vars.SAUCEDEMO_USERNAME || secrets.SAUCEDEMO_USERNAME }}
          SAUCEDEMO_PASSWORD: ${{ vars.SAUCEDEMO_PASSWORD || secrets.SAUCEDEMO_PASSWORD }}
      # Sube el reporte como artefacto descargable desde la pestana Actions
      # !cancelled() -> sube aunque los tests fallen (para ver que paso)
      # retention-days: 30 -> se elimina automaticamente despues de 30 dias
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Notificacion a Slack al finalizar (pase o falle)
      # Requisito: agregar SLACK_WEBHOOK_URL como secret en Settings > Secrets del repo
      - name: Notify Slack - Playwright
        # Se ejecuta siempre, incluso si los tests fallaron
        if: ${{ !cancelled() }}
        # Action oficial de Slack para enviar mensajes via webhook
        uses: slackapi/slack-github-action@v2.1.0
        with:
          # URL del Incoming Webhook de Slack (guardada como secret para no exponerla)
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Tipo de webhook: incoming-webhook es el mas simple, no requiere bot token
          webhook-type: incoming-webhook
          # Payload en formato Slack Block Kit (JSON)
          # "text"   -> texto fallback (notificaciones push del movil o previews)
          # "blocks" -> tarjetas visuales con formato en el canal de Slack
          # "type: section" -> bloque de texto con markdown de Slack (mrkdwn)
          # mrkdwn permite: *negrita*, `codigo`, <url|texto>, emojis :white_check_mark:
          # job.status == 'success' muestra checkmark verde, cualquier otro estado muestra X roja
          # github.ref_name  -> nombre de la rama que disparo el workflow (ej: main)
          # github.sha       -> hash del commit (identifica exactamente que codigo se probo)
          # github.run_id    -> ID del run, permite armar el link directo a Actions
          payload: |
            {
              "text": "Playwright Tests: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Playwright Tests* ${{ job.status == 'success' && ':white_check_mark: PASSED' || ':x: FAILED' }}\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver resultado en Actions>"
                  }
                }
              ]
            }

  # JOB 2: Tests BDD con Cucumber (.feature) - corre EN PARALELO con playwright
  cucumber:
    name: Cucumber Tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_suite == 'all' || inputs.test_suite == 'cucumber' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Los secrets del Environment solo son accesibles si el job declara el environment
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      # En push/PR corre todos los .feature; en dispatch manual permite ruta(s) y tag opcional
      - name: Run Cucumber tests
        run: |
          CU_PATHS="${{ inputs.cucumber_paths }}"
          CU_TAG="${{ inputs.cucumber_tag }}"

          [ -z "$CU_PATHS" ] && CU_PATHS="tests/features/**/*.feature"
          CU_PATHS=$(echo "$CU_PATHS" | tr ',' ' ')

          if [ -n "$CU_TAG" ]; then
            node --import tsx ./node_modules/@cucumber/cucumber/bin/cucumber.js $CU_PATHS --tags "$CU_TAG"
          else
            node --import tsx ./node_modules/@cucumber/cucumber/bin/cucumber.js $CU_PATHS
          fi
        env:
          BASE_URL: ${{ vars.BASE_URL || secrets.BASE_URL }}
          SAUCEDEMO_USERNAME: ${{ vars.SAUCEDEMO_USERNAME || secrets.SAUCEDEMO_USERNAME }}
          SAUCEDEMO_PASSWORD: ${{ vars.SAUCEDEMO_PASSWORD || secrets.SAUCEDEMO_PASSWORD }}
      # Sube el reporte HTML de Cucumber como artefacto descargable
      - name: Upload Cucumber report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cucumber-report
          path: cucumber-report.html
          retention-days: 30
          if-no-files-found: ignore

      # Notificacion a Slack al finalizar (pase o falle)
      - name: Notify Slack - Cucumber
        # Se ejecuta siempre, incluso si los tests fallaron
        if: ${{ !cancelled() }}
        # Action oficial de Slack para enviar mensajes via webhook
        uses: slackapi/slack-github-action@v2.1.0
        with:
          # URL del Incoming Webhook de Slack (guardada como secret para no exponerla)
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Tipo de webhook: incoming-webhook es el mas simple, no requiere bot token
          webhook-type: incoming-webhook
          # Payload en formato Slack Block Kit (JSON)
          # "text"   -> texto fallback (notificaciones push del movil o previews)
          # "blocks" -> tarjetas visuales con formato en el canal de Slack
          # "type: section" -> bloque de texto con markdown de Slack (mrkdwn)
          # mrkdwn permite: *negrita*, `codigo`, <url|texto>, emojis :white_check_mark:
          # job.status == 'success' muestra checkmark verde, cualquier otro estado muestra X roja
          # github.ref_name  -> nombre de la rama que disparo el workflow (ej: main)
          # github.sha       -> hash del commit (identifica exactamente que codigo se probo)
          # github.run_id    -> ID del run, permite armar el link directo a Actions
          payload: |
            {
              "text": "Cucumber Tests: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Cucumber Tests* ${{ job.status == 'success' && ':white_check_mark: PASSED' || ':x: FAILED' }}\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver resultado en Actions>"
                  }
                }
              ]
            }
